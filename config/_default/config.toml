# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://jpanther.github.io/congo/docs/getting-started/

baseURL = "https://hahatay.network/"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true

enableRobotsTXT = true
summaryLength = 0
# The server has one CPU: with an empty image cache, a page full of photos takes over a minute.
timeout = "10m"

[pagination]
pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]
